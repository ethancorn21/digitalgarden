# Shared sandbox for the svc jobs (copied into each unit by install-svc.sh). svc cannot see /home, so nothing an
# agent writes in ~ethan can reach these jobs, and they cannot reach ethan's keys either.
ProtectSystem=strict
ReadWritePaths=/var/lib/svc
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
NoNewPrivileges=yes
CapabilityBoundingSet=
RestrictSUIDSGID=yes
RestrictNamespaces=yes
LockPersonality=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
SystemCallArchitectures=native
UMask=0077
